<style>

#al3-preview .al3-map{position:relative;flex:1;min-height:0}

#al3-preview .al3-tile strong{display:block;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;font-weight:600}
#al3-preview .al3-tile span{font-size:11px}

@keyframes al3-flow{to{--al3-orbit:360deg}}
#al3-preview .al3-app.reduced .al3-tile::after{animation:none!important}
#al3-preview .al3-table-head,#al3-preview .al3-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 43px;gap:5px;align-items:center}
#al3-preview .al3-table-head{padding:5px;color:var(--muted);font-size:11px}

#al3-preview .al3-row{flex:none;width:100%;height:53px;padding:6px 5px;border:0;border-bottom:1px solid rgba(157,95,78,.14);border-radius:0;text-align:left;background:rgba(255,251,247,.12);min-width:0}

#al3-preview .al3-row-size,#al3-preview .al3-row-percent{text-align:right;white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums}

#al3-preview .al3-list-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;min-height:25px;font-size:11px;color:var(--muted)}

#al3-preview .al3-dialog-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:20px}

#al3-preview .al3-image-ref{aspect-ratio:1440/940;background:var(--wall) center/cover no-repeat;border-radius:10px}
#al3-preview .al3-fixed-note{font-size:11px;color:var(--muted);margin-top:8px}
#al3-preview .al3-filter-layer{place-items:start end;padding:30% 3% 0;background:transparent;pointer-events:none}

#al3-preview .al3-file-facts{display:grid;grid-template-columns:1fr 1fr;gap:13px;font-size:12px}

#al3-preview .al3-app.compact .al3-row{height:44px}

@container (min-width:1150px){
 #al3-preview .al3-work{grid-template-rows:38px 38px 72px 40px minmax(0,1fr) 76px 38px;gap:12px;padding:20px 24px 14px}
 #al3-preview .al3-stat strong{font-size:27px}
 #al3-preview .al3-row{height:64px}
 #al3-preview .al3-row-name strong,#al3-preview .al3-tile strong,#al3-preview .al3-detail-name{font-size:14px}
 #al3-preview .al3-row-name small,#al3-preview .al3-row-size,#al3-preview .al3-row-percent,#al3-preview .al3-detail-meta,#al3-preview .al3-detail-path,#al3-preview .al3-tile span{font-size:12px}

@media(max-width:740px){
 #al3-preview .al3-app{aspect-ratio:auto;min-height:1100px}

 #al3-preview .al3-search{flex:1;min-width:140px}
 #al3-preview .al3-analysis{grid-template-columns:minmax(0,1fr);grid-template-rows:240px 300px;gap:9px}

<script>
(() => {
 const root=document.getElementById('al3-preview');
 const wall='__AL3_WALL__',icon='__AL3_ICON__';
 const GiB=1073741824,MiB=1048576;
 const defaults={strength:100,palette:'original',density:'comfortable'};

 const files=[
  {id:'video',name:'travel-footage.mp4',path:'视频 Videos',logical:6*GiB,allocated:6*GiB,category:'视频'},
  {id:'backup',name:'project-backup.zip',path:'项目 Projects',logical:4*GiB,allocated:3.8*GiB,category:'压缩包'},
  {id:'dataset',name:'image-dataset.raw',path:'图片 Pictures',logical:3*GiB,allocated:3*GiB,category:'图片'},

  {id:'bin',name:'sample-data.bin',path:'应用 Apps',logical:.02*GiB,allocated:.018*GiB,category:'其他'}
 ];
 const bytes=n=>n===null?'未知':n>=GiB?`${(n/GiB).toFixed(2).replace(/\.00$/,'')} GiB`:`${(n/MiB).toFixed(1).replace(/\.0$/,'')} MiB`;
 const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function make(app){

  const q=s=>app.querySelector(s),qa=s=>app.querySelectorAll(s);
  function persist(){window.openai?.setWidgetState({modelContent:{preview:'第三阶段高级分析与个性化',scene,minLogicalBytes:state.min,extension:state.extension,backgroundStrength:state.strength,palette:state.palette,density:state.density},privateContent:null}).catch(()=>{});}
  function appearance(){
   app.style.setProperty('--wall-strength',state.strength/100);app.classList.toggle('compact',state.density==='compact');app.classList.toggle('reduced',state.reduced);
   const colors=state.palette==='clearer'?clearer:original;
   q('.al3-legend').innerHTML=Object.entries(colors).map(([name,color])=>`<span class="al3-key"><i style="background:${color}"></i>${name}</span>`).join('');
   q('[data-strength]').value=state.strength;q('[data-strength-value]').textContent=state.strength===100?'当前 100%':`${state.strength}%`;
   q('[data-palette]').value=state.palette;q('[data-density]').value=state.density;
  }
  function layout(items,x=0,y=0,w=100,h=100,out=[]){
   if(!items.length)return out;if(items.length===1){out.push({file:items[0],x,y,w,h});return out;}
   const total=items.reduce((s,f)=>s+f[state.metric],0);let subtotal=0,cut=1;
   for(let i=0;i<items.length-1;i++){subtotal+=items[i][state.metric];cut=i+1;if(subtotal>=total/2)break;}
   const a=items.slice(0,cut),b=items.slice(cut),ratio=a.reduce((s,f)=>s+f[state.metric],0)/total;
   if(w>=h){layout(a,x,y,w*ratio,h,out);layout(b,x+w*ratio,y,w*(1-ratio),h,out);}else{layout(a,x,y,w,h*ratio,out);layout(b,x,y+h*ratio,w,h*(1-ratio),out);}return out;
  }
  function render(){
   appearance();
   const total=files.reduce((s,f)=>s+(f[state.metric]??0),0),unknown=files.some(f=>f[state.metric]===null);
   q('[data-total-title]').textContent=state.metric==='logical'?'当前目录大小':'实际占用空间';q('[data-total]').textContent=bytes(total)+(unknown?' + 未知':'');
   const matched=files.filter(f=>f.logical>=state.min&&(state.extension==='all'||f.name.endsWith(state.extension))&&f.name.toLowerCase().includes(state.search.toLowerCase()));
   matched.sort((a,b)=>(b[state.metric]??-1)-(a[state.metric]??-1));
   if(!matched.some(f=>f.id===state.selected))state.selected=null;
   const colors=state.palette==='clearer'?clearer:original;
   q('.al3-map').innerHTML=layout(matched.filter(f=>(f[state.metric]??0)>0)).map(({file:f,x,y,w,h})=>`<button type="button" class="al3-tile" data-file="${f.id}" aria-pressed="${f.id===state.selected}" aria-label="${escape(f.name)}，${bytes(f[state.metric])}" style="left:calc(${x}% + 2px);top:calc(${y}% + 2px);width:calc(${w}% - 4px);height:calc(${h}% - 4px);background:${colors[f.category]}a6"><strong>${escape(f.name)}</strong><span>${bytes(f[state.metric])}</span></button>`).join('')||'<div class="al3-empty">没有可绘制的匹配项</div>';
   q('.al3-rows').innerHTML=matched.map(f=>`<button type="button" class="al3-row" role="option" data-file="${f.id}" aria-selected="${f.id===state.selected}"><span class="al3-row-name"><strong>${escape(f.name)}</strong><small>${escape(f.path)}</small></span><span class="al3-row-size">${bytes(f[state.metric])}</span><span class="al3-row-percent">${f[state.metric]===null?'—':(f[state.metric]/total*100).toFixed(1)+'%'}</span></button>`).join('')||'<div class="al3-empty">没有匹配项</div>';
   q('[data-list-count]').textContent=`${matched.length} 项${state.min?' · ≥ '+bytes(state.min):''}${state.extension!=='all'?' · '+state.extension:''}`;
   q('[data-open-filter]').textContent=state.min||state.extension!=='all'?'筛选 · 已启用':'筛选';
   q('[data-open-filter]').classList.toggle('al3-filtered',!!(state.min||state.extension!=='all'));q('[data-clear-filter]').hidden=!state.min&&state.extension==='all';
   const selected=files.find(f=>f.id===state.selected);
   q('.al3-detail-name').textContent=selected?.name||'未选择项目';q('.al3-detail-meta').textContent=selected?`文件大小 ${bytes(selected.logical)} · 实际占用 ${bytes(selected.allocated)}`:'';
   q('.al3-detail-path').textContent=selected?`X:\\AsukaLens-Demo\\${selected.path}\\${selected.name}`:'';q('[data-open-details]').disabled=!selected;
   q('[data-settings-layer]').hidden=!state.settingsOpen;q('[data-filter-layer]').hidden=!state.filterOpen;q('[data-details-layer]').hidden=!state.detailsOpen;q('[data-open-filter]').setAttribute('aria-expanded',String(state.filterOpen));
   qa('[data-file]').forEach(button=>button.addEventListener('click',()=>{state.selected=button.dataset.file;render();persist();}));
  }
  q('[data-open-filter]').onclick=()=>{state.filterOpen=!state.filterOpen;q('[data-min]').value=state.min;q('[data-extension]').value=state.extension;render();};
  q('[data-close-filter]').onclick=()=>{state.filterOpen=false;render();};
  q('[data-apply-filter]').onclick=()=>{state.min=Number(q('[data-min]').value);state.extension=q('[data-extension]').value;state.filterOpen=false;render();persist();};
  q('[data-reset-filter]').onclick=()=>{q('[data-min]').value='0';q('[data-extension]').value='all';};

  q('.al3-search').oninput=e=>{state.search=e.target.value;render();};

  q('[data-reduced]').onchange=e=>{state.reduced=e.target.checked;appearance();};
  q('[data-open-settings]').onclick=()=>{draft={strength:state.strength,palette:state.palette,density:state.density};state.settingsOpen=true;state.filterOpen=false;render();};
  const changeDisplay=()=>{state.strength=Number(q('[data-strength]').value);state.palette=q('[data-palette]').value;state.density=q('[data-density]').value;render();};
  q('[data-strength]').oninput=changeDisplay;q('[data-palette]').onchange=changeDisplay;q('[data-density]').onchange=changeDisplay;

  qa('[data-setting-tab]').forEach(button=>button.onclick=()=>{const image=button.dataset.settingTab==='image';q('[data-image-tab]').hidden=!image;q('[data-display-tab]').hidden=image;qa('[data-setting-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));});

  app.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.detailsOpen)state.detailsOpen=false;else if(state.filterOpen)state.filterOpen=false;else if(state.settingsOpen){Object.assign(state,draft);state.settingsOpen=false;}render();}});
  function restore(snapshot){const incoming=snapshot?.modelContent??snapshot;if(incoming?.preview!=='第三阶段高级分析与个性化'||incoming.scene!==scene)return;if(['original','clearer'].includes(incoming.palette))state.palette=incoming.palette;if(['comfortable','compact'].includes(incoming.density))state.density=incoming.density;if(Number.isFinite(incoming.backgroundStrength))state.strength=Math.max(40,Math.min(100,incoming.backgroundStrength));if([0,100*MiB,GiB,5*GiB].includes(incoming.minLogicalBytes))state.min=incoming.minLogicalBytes;if(['all','.zip','.mp4','.raw','.iso','.psd','.pdf','.bin'].includes(incoming.extension))state.extension=incoming.extension;draft={strength:state.strength,palette:state.palette,density:state.density};render();}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{render();persist();}});tweak.addSlider(state,'strength',{label:'背景显示强度',min:40,max:100,step:5,unit:'%'});tweak.addSelect(state,'palette',{label:'图块配色',options:[{label:'原有类别色',value:'original'},{label:'类别分明',value:'clearer'}]});tweak.addSelect(state,'density',{label:'阅读密度',options:[{label:'舒适（当前）',value:'comfortable'},{label:'紧凑',value:'compact'}]});}
 }
